<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Blog</title>
    <link rel="shortcut icon" href="./assets/icons/logo.svg" type="image/x-icon">

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/standard.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <header class="site-header">
        <a href="index.html"><img src="./assets/icons/logo.svg" alt="Firmenlogo Travelblog"></a>
        <nav>
            <ul>
                <li><a href="#highlights">Highlights</a>
                    <div class="hover hover-highlights"></div>
                </li>
                <li><a href="#faq">FAQ</a>
                    <div class="hover hover-faq"></div>
                </li>
                <li><a href="#contact">Contact</a>
                    <div class="hover hover-contact"></div>
                </li>
            </ul>
        </nav>
    </header>

<section class="hero-section">

    <div class="hero-photo">
        <img
            class="hero-photo-img"
            src="./assets/img/hero.jpg"
            alt="Cappadocia"
        >
    </div>

    <img
        class="hero-yellow"
        src="./assets/img/hero_mobile_end.png"
        alt=""
    >

    <div class="hero-text">
        <h1>Cappadocia</h1>

        <p>
            From sunrise balloons to hidden cave dwellings,
            every moment feels unreal in the best way.
        </p>
    </div>

    <div class="hero-badge">

        <img
            class="badge-rotating"
            src="./assets/img/Property 1=01.png"
            alt=""
        >

        <img
            class="badge-flag"
            src="./assets/img/Property 1=01.png"
            alt="Turkey"
        >

    </div>

</section>

    <main class="main-landingpage">
        <section id="highlights">
            <header class="landingpage-headline">
                <img src="./assets/icons/rocket_launch_yellow.svg" alt="Raketenicon">
                <h2>Highlights</h2>
            </header>
        </section>
        <section id="faq">
            <header class="landingpage-headline">
                <img src="./assets/icons/live_help_yellow.svg" alt="Fragenicon">
                <h2>FAQ</h2>
            </header>
        </section>
        <section id="contact">
            <header class="landingpage-headline">
                <img src="./assets/icons/person_pin_yellow.svg" alt="Contacticon">
                <h2>Contact form</h2>
            </header>
            <form class="contact-form" action="#" method="POST">
                <div class="input-group">
                    <label for="name">What's your name?</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="input-group">
                    <label for="email">What's your email?</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="input-group">
                    <label for="message">How can I help?</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>

                <div class="privacy-group">
                    <input type="checkbox" id="privacy" name="privacy" required>
                    <label for="privacy">
                        I've read the <a href="#">privacy policy</a> and agree to the processing of my data as outlined.
                    </label>
                </div>

                <button type="submit" class="submit-btn">Send</button>
            </form>
        </section>
    </main>
    <footer>
        <div class="information">
            <div class="imprint-cookies">
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
            <div class="copyright-information">
                <img src="./assets/icons/copyright.svg" alt="">
                <p>Travel Blog 2026</p>
            </div>

        </div>
        <ul class="social-media-links">
            <li><a href="https://www.tiktok.com/de-DE/" target="_blank"><img src="./assets/icons/tiktok_icon 1.svg"
                        alt="Tiktok Logo"></a></li>
            <li><a href="https://www.youtube.com/" target="_blank"><img src="./assets/icons/youtube.svg"
                        alt="Youtube Logo"></a></li>
            <li><a href="https://www.facebook.com/" target="_blank"><img src="./assets/icons/facebook.svg"
                        alt="Facebook Logo"></a></li>
            <li><a href="https://www.instagram.com/" target="_blank"><img src="./assets/icons/instagram_logo_2016 1.svg"
                        alt="Instagram Logo"></a></li>
        </ul>
    </footer>
    <nav class="mobile-navbar">
        <ul>
            <li>
                <a href="index.html">
                    <img src="./assets/icons/home.svg" alt="Hausicon">
                </a>
            </li>
            <li>
                <a href="#highlights">
                    <img src="./assets/icons/rocket_launch.svg" alt="Raketenicon">
                </a>
            </li>
            <li>
                <a href="#faq">
                    <img src="./assets/icons/live_help.svg" alt="Fragenicon">
                </a>
            </li>
            <li>
                <a href="#contact">
                    <img src="./assets/icons/person_pin.svg" alt="Contacticon">
                </a>
            </li>
        </ul>
    </nav>
</body>

</html>
