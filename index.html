<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Blog</title>
    <link rel="shortcut icon" href="./assets/icons/logo.svg" type="image/x-icon">

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/standard.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <header class="site-header">
        <a class="company-logo" href="index.html"><img src="./assets/icons/logo.svg" alt="Firmenlogo Travelblog"></a>
        <nav>
            <ul>
                <li><a href="#highlights">Highlights</a>
                    <div class="hover hover-highlights"></div>
                </li>
                <li><a href="#faq">FAQ</a>
                    <div class="hover hover-faq"></div>
                </li>
                <li><a href="#contact">Contact</a>
                    <div class="hover hover-contact"></div>
                </li>
            </ul>
        </nav>
    </header>
    <section class="hero-section">
        <img class="hero-start-yellow" src="./assets/img/hero_mobile_start.png" alt="gelber Hintergrund">
        <img class="hero-end-yellow" src="./assets/img/hero_mobile_end.png" alt="gelber Hintergrund">
        <div class="hero-img-wrapper"><img class="hero-img" src="./assets/img/hero.jpg"
                alt="Zwei Personen sitzen auf einer Terasse im Urlaub">
        </div>
        <div class="hero-section-circle">
            <img class="hero-section-circle-text" src="./assets/img/Cappadocia . Turkey ..svg" alt="">
            <img class="hero-section-circle-flag" src="./assets/img/Flag_orb_Turkey 1.svg" alt="">
        </div>
        <div class="hero-section-text">
            <h1>Cappadocia</h1>
            <p>From sunrise ballons to hidden cave dwellings, every moment feels unreal in the best</p>
        </div>
    </section>
    <main class="main-landingpage">
        <section id="highlights">
            <header class="landingpage-headline">
                <img src="./assets/icons/rocket_launch_yellow.svg" alt="Raketenicon">
                <h2>Highlights</h2>
            </header>
        </section>
        <section id="faq">
            <header class="landingpage-headline">
                <img src="./assets/icons/live_help_yellow.svg" alt="Fragenicon">
                <h2>FAQ</h2>
            </header>
        </section>
        <section id="contact">
            <header class="landingpage-headline">
                <img src="./assets/icons/person_pin_yellow.svg" alt="Contacticon">
                <h2>Contact form</h2>
            </header>
        </section>
    </main>
    <footer>
        <div class="information">
            <div class="imprint-cookies">
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
            <div class="copyright-information">
                <img src="./assets/icons/copyright.svg" alt="">
                <p>Travel Blog 2026</p>
            </div>

        </div>
        <ul class="social-media-links">
            <li><a href="https://www.tiktok.com/de-DE/" target="_blank"><img src="./assets/icons/tiktok_icon 1.svg"
                        alt="Tiktok Logo"></a></li>
            <li><a href="https://www.youtube.com/" target="_blank"><img src="./assets/icons/youtube.svg"
                        alt="Youtube Logo"></a></li>
            <li><a href="https://www.facebook.com/" target="_blank"><img src="./assets/icons/facebook.svg"
                        alt="Facebook Logo"></a></li>
            <li><a href="https://www.instagram.com/" target="_blank"><img src="./assets/icons/instagram_logo_2016 1.svg"
                        alt="Instagram Logo"></a></li>
        </ul>
    </footer>
    <nav class="mobile-navbar">
        <ul>
            <li>
                <a href="index.html">
                    <img src="./assets/icons/home.svg" alt="Hausicon">
                </a>
            </li>
            <li>
                <a href="#highlights">
                    <img src="./assets/icons/rocket_launch.svg" alt="Raketenicon">
                </a>
            </li>
            <li>
                <a href="#faq">
                    <img src="./assets/icons/live_help.svg" alt="Fragenicon">
                </a>
            </li>
            <li>
                <a href="#contact">
                    <img src="./assets/icons/person_pin.svg" alt="Contacticon">
                </a>
            </li>
        </ul>
    </nav>
</body>

</html>
